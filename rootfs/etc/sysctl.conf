# Increase the maximum amount of option memory buffers
net.core.optmem_max = 32768

# Increase the maximum number of IGMP memberships
net.ipv4.igmp_max_memberships = 1024

# Turn on IP Forwarding
net.ipv4.ip_forward = 1

# Turn on TCP SYN Cookie Protection
net.ipv4.tcp_syncookies = 1

# Disable TCP/IP Explicit Congestion Notification
net.ipv4.tcp_ecn = 0

# This is the best method: turn on Source Address Verification and get
# spoof protection on all current and future interfaces.
net.ipv4.conf.eth0.rp_filter = 1

#Setup Arp table to be much larger than 1024 kernel default
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 16384

# Disable ICMP Redirect Requests for IPv4
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0

# Disable ICMP Redirect Requests for IPv6
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0

# Reduce the TCP timeout in established state to 60 minutes since worst case
# spoofer timer to clear idle session is 45 minutes. Even if the connection
# is removed from the connection tracking table the actual session isn't
# affected and a new entry will be added when session resumes sending traffic
net.ipv4.netfilter.ip_conntrack_tcp_timeout_established=3600
